name: Build Element v4 Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'element-v0.2.patch'
      - 'scripts/*.ps1'
      - '.github/workflows/build-v4-windows.yml'

jobs:
  build-windows-v4:
    runs-on: windows-latest
    steps:
      - name: Checkout Element patch repo
        uses: actions/checkout@v4
        with:
          path: element

      - name: Checkout upstream fm-editor
        uses: actions/checkout@v4
        with:
          repository: barak14/fm-editor
          ref: 3b41801958e874210ac884fd81222e9ea06c88b8
          path: source

      - name: Apply proven Element v0.2 patch
        shell: bash
        run: |
          cd source
          git apply ../element/element-v0.2.patch

      - name: Apply Element current release stack through v4.2.1
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/apply-element-current.ps1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build v4.2.1 release
        shell: pwsh
        run: |
          cd source
          cargo build --release --locked --message-format=short 2>&1 | Tee-Object ../build-v421.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload v4.2.1 build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v4.2.1-build-diagnostics
          path: build-v421.log
          if-no-files-found: error

      - name: Stage v4.2.1 executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item source/target/release/fm-editor.exe dist/Element-FM27-Editor.exe
          Copy-Item source/LICENSE dist/LICENSE
          Copy-Item source/ELEMENT_ROADMAP.md dist/ELEMENT_ROADMAP.md

      - name: Upload Element v4.2.1 Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Element-FM27-Editor-Windows-x64-v4.2.1-INTELLIGENCE-ACCURACY
          path: dist/*
          if-no-files-found: error
