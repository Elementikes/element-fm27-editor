name: Build Element v6.0 Windows

on:
  workflow_dispatch:

jobs:
  build-windows-v60:
    runs-on: windows-latest
    steps:
      - name: Checkout Element patch repo
        uses: actions/checkout@v4
        with:
          path: element

      - name: Validate Element v6 JSON configuration
        shell: pwsh
        run: |
          python element/scripts/validate-v6-config.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout upstream fm-editor
        uses: actions/checkout@v4
        with:
          repository: barak14/fm-editor
          ref: 3b41801958e874210ac884fd81222e9ea06c88b8
          path: source

      - name: Apply proven Element v0.2 patch
        shell: bash
        run: |
          cd source
          git apply ../element/element-v0.2.patch

      - name: Apply Element release stack through v6.0
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/apply-v6.0-release.ps1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build v6.0 release
        shell: pwsh
        run: |
          cd source
          cargo build --release --locked --message-format=short 2>&1 | Tee-Object ../build-v60.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload v6.0 build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v6.0-build-diagnostics
          path: build-v60.log
          if-no-files-found: error

      - name: Stage v6.0 executable and data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item source/target/release/fm-editor.exe dist/Element-FM27-Editor.exe
          Copy-Item source/LICENSE dist/LICENSE
          Copy-Item source/ELEMENT_ROADMAP.md dist/ELEMENT_ROADMAP.md
          New-Item -ItemType Directory -Force -Path dist/element-data | Out-Null
          Copy-Item element/config/element-v6/*.json dist/element-data/
          Copy-Item element/config/element-v6/README.md dist/element-data/README.md

      - name: Upload Element v6.0 Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Element-FM27-Editor-Windows-x64-v6.0-OFFLINE-FOUNDATION
          path: dist/**
          if-no-files-found: error
