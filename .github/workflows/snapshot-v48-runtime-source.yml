name: Snapshot Element v4.8 runtime source

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/snapshot-v48-runtime-source.yml'

jobs:
  snapshot:
    runs-on: windows-latest
    steps:
      - name: Checkout Element patch repo
        uses: actions/checkout@v4
        with:
          path: element
      - name: Checkout upstream fm-editor
        uses: actions/checkout@v4
        with:
          repository: barak14/fm-editor
          ref: 3b41801958e874210ac884fd81222e9ea06c88b8
          path: source
      - name: Apply Element stack through v4.8
        shell: pwsh
        run: |
          cd source
          git apply ../element/element-v0.2.patch
          & ../element/scripts/apply-element-current.ps1
      - name: Upload generated v4.8 source
        uses: actions/upload-artifact@v4
        with:
          name: Element-v4.8-runtime-source
          path: |
            source/src/**
            source/Cargo.toml
            source/Cargo.lock
          if-no-files-found: error
