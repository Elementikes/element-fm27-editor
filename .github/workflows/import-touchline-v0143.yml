name: Import public Touchline 0.14.3 source for mapping research

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-touchline-v0143.yml'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Element
        uses: actions/checkout@v4
      - name: Checkout public Touchline editor
        uses: actions/checkout@v4
        with:
          repository: DevHHM/touchline-editor
          path: touchline
      - name: Extract published source archive
        run: |
          mkdir -p extracted
          unzip -q touchline/Touchline-Editor-0.14.3-source.zip -d extracted
          find extracted -type f | sort > extracted/FILELIST.txt
          grep -RniE 'FM27|offset|injur|absence|ban|suspension|registration|home.?grown|work.?permit|promise|transfer|loan|club.?id|team.?id|squad|cohesion|relationship' extracted --include='*.rs' --include='*.toml' --include='*.md' > extracted/MAPPING-HITS.txt || true
      - name: Upload research source
        uses: actions/upload-artifact@v4
        with:
          name: Touchline-0.14.3-public-source-research
          path: extracted/**
          if-no-files-found: error
