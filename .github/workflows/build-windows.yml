name: Build Element FM27 Editor Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'element-v0.2.patch'
      - 'scripts/*.ps1'
      - 'scripts/*.py'
      - 'layers/*.py'
      - 'patches/*.b64'
      - 'config/element-v6/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Element patch repo
        uses: actions/checkout@v4
        with:
          path: element

      - name: Validate Element v6 JSON configuration
        shell: pwsh
        run: |
          python element/scripts/validate-v6-config.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout upstream fm-editor
        uses: actions/checkout@v4
        with:
          repository: barak14/fm-editor
          ref: 3b41801958e874210ac884fd81222e9ea06c88b8
          path: source

      - name: Apply proven Element v0.2 patch
        shell: bash
        run: |
          cd source
          git apply ../element/element-v0.2.patch

      - name: Apply Element release stack through v6.4.3
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/apply-v6.0-release.ps1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build current release
        shell: pwsh
        run: |
          cd source
          cargo build --release --locked --message-format=short 2>&1 | Tee-Object ../build-current.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v6.4.3-build-diagnostics
          path: build-current.log
          if-no-files-found: error

      - name: Stage executable and v6 data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item source/target/release/fm-editor.exe dist/Element-FM27-Editor.exe
          Copy-Item source/LICENSE dist/LICENSE
          if (Test-Path source/ELEMENT_ROADMAP.md) { Copy-Item source/ELEMENT_ROADMAP.md dist/ELEMENT_ROADMAP.md }
          New-Item -ItemType Directory -Force -Path dist/element-data | Out-Null
          Copy-Item element/config/element-v6/*.json dist/element-data/
          Copy-Item element/config/element-v6/README.md dist/element-data/README.md

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Element-FM27-Editor-Windows-x64-v6.4.3-FMRTE-TEAM-COHESION-MAPPER
          path: dist/**
          if-no-files-found: error
