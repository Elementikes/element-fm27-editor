name: Build Element FM27 Editor Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, element-v1-ui-transfer ]
    paths:
      - 'element-v0.2.patch'
      - 'scripts/*.ps1'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Element patch repo
        uses: actions/checkout@v4
        with:
          path: element

      - name: Checkout upstream fm-editor
        uses: actions/checkout@v4
        with:
          repository: barak14/fm-editor
          ref: 3b41801958e874210ac884fd81222e9ea06c88b8
          path: source

      - name: Apply proven Element v0.2 patch
        shell: bash
        run: |
          cd source
          git apply ../element/element-v0.2.patch

      - name: Apply Element v0.3 theme layer
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/apply-v0.3-ui.ps1

      - name: Apply Element v0.4 redesign layer
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/apply-v0.4-ui.ps1

      - name: Apply Element v0.5 editor-style player UI
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/apply-v0.5-ui.ps1

      - name: Apply Element v0.6 full-width editor shell
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/apply-v0.6-shell.ps1

      - name: Apply Element v0.7 UI 2.0
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/apply-v0.7-element-ui.ps1

      - name: Apply Element v0.8 dense editor shell
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/apply-v0.8-element-shell.ps1

      - name: Prepare existing branding for v0.9 transform
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/prepare-v0.9-main.ps1

      - name: Apply Element v0.9 real application-shell rebuild
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/apply-v0.9-rebuild.ps1

      - name: Prepare v1.5 compatibility boundaries
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/prepare-v1.5-compat.ps1

      - name: Apply Element v1.5 premium player workspace
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/apply-v1.0-ui-transfer.ps1

      - name: Apply Element v1.6 compact player and club workspace
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/apply-v1.6-compact-club.ps1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        shell: pwsh
        run: |
          cd source
          cargo build --release --locked

      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item source/target/release/fm-editor.exe dist/Element-FM27-Editor.exe
          Copy-Item source/LICENSE dist/LICENSE
          Copy-Item source/ELEMENT_ROADMAP.md dist/ELEMENT_ROADMAP.md

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Element-FM27-Editor-Windows-x64-v1.6-COMPACT-CLUB
          path: dist/*
          if-no-files-found: error
