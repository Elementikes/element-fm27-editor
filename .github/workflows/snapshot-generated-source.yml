name: Snapshot generated Element source

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/snapshot-generated-source.yml'

jobs:
  snapshot:
    runs-on: windows-latest
    steps:
      - name: Checkout Element patch repo
        uses: actions/checkout@v4
        with:
          path: element
      - name: Checkout upstream fm-editor
        uses: actions/checkout@v4
        with:
          repository: barak14/fm-editor
          ref: 3b41801958e874210ac884fd81222e9ea06c88b8
          path: source
      - name: Apply proven Element v0.2 patch
        shell: bash
        run: |
          cd source
          git apply ../element/element-v0.2.patch
      - name: Apply Element current release stack
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/apply-element-current.ps1
      - name: Stage generated source snapshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path snapshot/src/ui/pages | Out-Null
          New-Item -ItemType Directory -Force -Path snapshot/src/bridge | Out-Null
          New-Item -ItemType Directory -Force -Path snapshot/src/fields/fm27 | Out-Null
          Copy-Item source/src/ui/club_panel.rs snapshot/src/ui/club_panel.rs
          Copy-Item source/src/ui/player_panel.rs snapshot/src/ui/player_panel.rs
          Copy-Item source/src/ui/navigation.rs snapshot/src/ui/navigation.rs
          Copy-Item source/src/ui/pages/player_search.rs snapshot/src/ui/pages/player_search.rs
          Copy-Item source/src/ui/pages/club_search.rs snapshot/src/ui/pages/club_search.rs
          Copy-Item source/src/app.rs snapshot/src/app.rs
          Copy-Item source/src/cache.rs snapshot/src/cache.rs
          Copy-Item source/src/settings.rs snapshot/src/settings.rs
          Copy-Item source/src/player.rs snapshot/src/player.rs
          Copy-Item source/src/bridge/bulk_load.rs snapshot/src/bridge/bulk_load.rs
          Copy-Item source/src/bridge/cmd.rs snapshot/src/bridge/cmd.rs
          Copy-Item source/src/bridge/worker.rs snapshot/src/bridge/worker.rs
          Copy-Item source/src/bridge/entity_load.rs snapshot/src/bridge/entity_load.rs
          Copy-Item source/src/fields/mod.rs snapshot/src/fields/mod.rs
          Copy-Item source/src/fields/fm27/player.rs snapshot/src/fields/fm27/player.rs
          Copy-Item source/Cargo.toml snapshot/Cargo.toml
      - name: Upload generated source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Element-generated-source-v4.2.2-expanded
          path: snapshot/**
          if-no-files-found: error
