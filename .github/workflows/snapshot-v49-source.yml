name: Snapshot v4.9 generated source

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/snapshot-v49-source.yml'

jobs:
  snapshot:
    runs-on: windows-latest
    steps:
      - name: Checkout Element
        uses: actions/checkout@v4
        with:
          path: element
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: barak14/fm-editor
          ref: 3b41801958e874210ac884fd81222e9ea06c88b8
          path: source
      - name: Apply Element stack
        shell: bash
        run: |
          cd source
          git apply ../element/element-v0.2.patch
      - name: Apply current release layers
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/apply-element-current.ps1
      - name: Stage files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path snapshot/src/ui/pages | Out-Null
          New-Item -ItemType Directory -Force -Path snapshot/src/ui | Out-Null
          Copy-Item source/src/ui/pages/player_search.rs snapshot/src/ui/pages/player_search.rs
          Copy-Item source/src/cache.rs snapshot/src/cache.rs
          Copy-Item source/src/bridge/bulk_load.rs snapshot/src/bridge_bulk_load.rs
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Element-v4.9-generated-source-snapshot
          path: snapshot/**
          if-no-files-found: error
