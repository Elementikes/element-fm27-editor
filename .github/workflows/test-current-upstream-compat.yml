name: Probe Element on Current FM27 Upstream

on:
  workflow_dispatch:

jobs:
  compat:
    runs-on: windows-latest
    steps:
      - name: Checkout Element
        uses: actions/checkout@v4
        with:
          path: element

      - name: Checkout current fm-editor upstream
        uses: actions/checkout@v4
        with:
          repository: barak14/fm-editor
          ref: b377ec5bba4ffb7dd37c9347c9d0dac051cf8fd1
          path: source

      - name: Probe adapted Element release stack
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path diag | Out-Null
          "UPSTREAM=b377ec5bba4ffb7dd37c9347c9d0dac051cf8fd1" | Tee-Object diag/compat.log
          Push-Location source
          python ../element/compat/apply-current-upstream-element-base.py 2>&1 | Tee-Object -Append ../diag/compat.log
          if ($LASTEXITCODE -ne 0) {
            "STAGE=BASE_ADAPTER_FAILED" | Tee-Object -Append ../diag/compat.log
            Pop-Location
            exit 0
          }
          "STAGE=BASE_ADAPTER_OK" | Tee-Object -Append ../diag/compat.log
          & ../element/scripts/apply-v6.0-release.ps1 2>&1 | Tee-Object -Append ../diag/compat.log
          if ($LASTEXITCODE -ne 0) {
            "STAGE=ELEMENT_STACK_FAILED" | Tee-Object -Append ../diag/compat.log
            Pop-Location
            exit 0
          }
          "STAGE=ELEMENT_STACK_OK" | Tee-Object -Append ../diag/compat.log
          cargo check --locked --message-format=short 2>&1 | Tee-Object -Append ../diag/compat.log
          if ($LASTEXITCODE -ne 0) {
            "STAGE=CARGO_CHECK_FAILED" | Tee-Object -Append ../diag/compat.log
          } else {
            "STAGE=CARGO_CHECK_OK" | Tee-Object -Append ../diag/compat.log
          }
          Pop-Location

      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: element-current-upstream-compat
          path: diag/**
          if-no-files-found: error
