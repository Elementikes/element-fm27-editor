name: v5 research snapshot

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v5-research-snapshot.yml'

jobs:
  snapshot:
    runs-on: windows-latest
    steps:
      - name: Checkout Element patch repo
        uses: actions/checkout@v4
        with:
          path: element

      - name: Checkout pinned upstream
        uses: actions/checkout@v4
        with:
          repository: barak14/fm-editor
          ref: 3b41801958e874210ac884fd81222e9ea06c88b8
          path: source

      - name: Apply Element current release stack
        shell: pwsh
        run: |
          cd source
          git apply ../element/element-v0.2.patch
          & ../element/scripts/apply-element-current.ps1

      - name: Checkout Laurentiu v0.1.1
        uses: actions/checkout@v4
        with:
          repository: Laurentiu-Andronache/fm-editor
          ref: v0.1.1
          path: laurentiu-v011

      - name: Checkout Laurentiu main
        uses: actions/checkout@v4
        with:
          repository: Laurentiu-Andronache/fm-editor
          ref: main
          path: laurentiu-main

      - name: Stage research snapshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path snapshot/element/src/ui/pages | Out-Null
          New-Item -ItemType Directory -Force -Path snapshot/element/src/bridge | Out-Null
          New-Item -ItemType Directory -Force -Path snapshot/element/src/fields/fm27 | Out-Null
          Copy-Item source/src/ui/player_panel.rs snapshot/element/src/ui/player_panel.rs
          Copy-Item source/src/ui/club_panel.rs snapshot/element/src/ui/club_panel.rs
          Copy-Item source/src/ui/pages/player_search.rs snapshot/element/src/ui/pages/player_search.rs
          Copy-Item source/src/cache.rs snapshot/element/src/cache.rs
          Copy-Item source/src/player.rs snapshot/element/src/player.rs
          Copy-Item source/src/club.rs snapshot/element/src/club.rs
          Copy-Item source/src/bridge/bulk_load.rs snapshot/element/src/bridge/bulk_load.rs
          Copy-Item source/src/bridge/entity_load.rs snapshot/element/src/bridge/entity_load.rs
          Copy-Item source/src/bridge/cmd.rs snapshot/element/src/bridge/cmd.rs
          Copy-Item source/src/bridge/worker.rs snapshot/element/src/bridge/worker.rs
          Copy-Item source/src/fields/fm27/player.rs snapshot/element/src/fields/fm27/player.rs
          Copy-Item source/src/fields/fm27/club.rs snapshot/element/src/fields/fm27/club.rs
          Copy-Item source/src/fields/mod.rs snapshot/element/src/fields/mod.rs
          Copy-Item source/src/app.rs snapshot/element/src/app.rs
          Copy-Item source/Cargo.toml snapshot/element/Cargo.toml
          Copy-Item -Recurse laurentiu-v011/src snapshot/laurentiu-v011-src
          Copy-Item -Recurse laurentiu-v011/docs/fm27 snapshot/laurentiu-v011-docs-fm27
          Copy-Item laurentiu-v011/LICENSE snapshot/laurentiu-v011-LICENSE
          Copy-Item -Recurse laurentiu-main/src snapshot/laurentiu-main-src
          Copy-Item -Recurse laurentiu-main/docs/fm27 snapshot/laurentiu-main-docs-fm27
          Copy-Item laurentiu-main/LICENSE snapshot/laurentiu-main-LICENSE

      - name: Upload research snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Element-v5-research-snapshot
          path: snapshot/**
          if-no-files-found: error
