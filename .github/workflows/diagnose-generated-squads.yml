name: Diagnose generated squads source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnose-generated-squads.yml'
      - 'layers/**'
      - 'scripts/**'
      - 'patches/**'
      - 'element-v0.2.patch'
  workflow_dispatch:

jobs:
  snapshot-squads:
    runs-on: windows-latest
    steps:
      - name: Checkout Element patch repo
        uses: actions/checkout@v4
        with:
          path: element

      - name: Checkout upstream fm-editor
        uses: actions/checkout@v4
        with:
          repository: barak14/fm-editor
          ref: 3b41801958e874210ac884fd81222e9ea06c88b8
          path: source

      - name: Apply Element base patch
        shell: bash
        run: |
          cd source
          git apply ../element/element-v0.2.patch

      - name: Apply Element current release stack
        shell: pwsh
        run: |
          cd source
          & ../element/scripts/apply-v6.0-release.ps1

      - name: Extract generated show_squads block
        shell: pwsh
        run: |
          $text = Get-Content source/src/ui/club_panel.rs -Raw
          $start = $text.IndexOf('fn show_squads(')
          if ($start -lt 0) { throw 'show_squads not found' }
          $end = $text.IndexOf("`nfn ", $start + 20)
          if ($end -lt 0) { $end = [Math]::Min($text.Length, $start + 30000) }
          New-Item -ItemType Directory -Force -Path diag | Out-Null
          $text.Substring($start, $end - $start) | Set-Content diag/show_squads.rs -NoNewline
          Copy-Item source/src/ui/club_panel.rs diag/club_panel.rs

      - name: Upload generated squad source
        uses: actions/upload-artifact@v4
        with:
          name: generated-squads-v6.5
          path: diag/**
          if-no-files-found: error
