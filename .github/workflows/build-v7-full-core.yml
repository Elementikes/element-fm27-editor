name: Build Element v7 Full Core Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'v7/**'
      - '.github/workflows/build-v7-full-core.yml'

concurrency:
  group: element-v7-full-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-v7:
    runs-on: windows-latest
    steps:
      - name: Checkout Element
        uses: actions/checkout@v4
        with:
          path: element

      - name: Checkout current FM27 editor core
        uses: actions/checkout@v4
        with:
          repository: barak14/fm-editor
          ref: b377ec5bba4ffb7dd37c9347c9d0dac051cf8fd1
          path: source

      - name: Apply Element v8.1.1 Full Core
        shell: pwsh
        run: |
          cd source
          python ../element/v7/apply-v7.0-full-core.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v7.0.1-compile-hotfix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v7.1-squad-power-tools.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v7.2-player-power-tools.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v7.3-force-buy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v7.4-data-hub.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v7.4.1-data-hub-compile-hotfix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v7.4.3-data-hub-final-hotfix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v7.4.2-club-show-compat.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v7.5-club-squads.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v7.5.1-squads-compile-hotfix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v7.6-staff-power-tools.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v7.7-club-power-tools.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v7.7.1-club-power-compile-hotfix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v7.8-fmrte-premium-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v7.9-fmrte-player-surfaces.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v7.9.1-relationships-borrow-hotfix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v8.0-fmrte-club-tactical.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v8.1a-swap-navigation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v8.1b1-player-core.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v8.1b2-player-extras.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v8.1c-staff-club-surfaces.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v8.1d-app-routing.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../element/v7/apply-v8.1.1-field-ref-hotfix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Element v8.1.1
        shell: pwsh
        run: |
          cd source
          cargo build --release --locked --message-format=short 2>&1 | Tee-Object ../build-v7.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload v8.1.1 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v8.1.1-buttons-live-build-diagnostics
          path: build-v7.log
          if-no-files-found: warn

      - name: Stage v8.1.1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item source/target/release/fm-editor.exe dist/Element-FM27-Editor.exe
          Copy-Item source/LICENSE dist/LICENSE
          if (Test-Path source/README.md) { Copy-Item source/README.md dist/README-UPSTREAM.md }
          if (Test-Path source/CHANGELOG.md) { Copy-Item source/CHANGELOG.md dist/CHANGELOG-UPSTREAM.md }

      - name: Upload Element v8.1.1 Buttons Live Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: Element-FM27-Editor-Windows-x64-v8.1.1-BUTTONS-LIVE
          path: dist/**
          if-no-files-found: error
