name: Diagnose Element v8 Generated Source

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnose-v8-current.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Element
        uses: actions/checkout@v4
        with:
          path: element

      - name: Checkout current FM27 editor core
        uses: actions/checkout@v4
        with:
          repository: barak14/fm-editor
          ref: b377ec5bba4ffb7dd37c9347c9d0dac051cf8fd1
          path: source

      - name: Apply Element v8.0 stack
        shell: bash
        run: |
          set -e
          cd source
          python ../element/v7/apply-v7.0-full-core.py
          python ../element/v7/apply-v7.0.1-compile-hotfix.py
          python ../element/v7/apply-v7.1-squad-power-tools.py
          python ../element/v7/apply-v7.2-player-power-tools.py
          python ../element/v7/apply-v7.3-force-buy.py
          python ../element/v7/apply-v7.4-data-hub.py
          python ../element/v7/apply-v7.4.1-data-hub-compile-hotfix.py
          python ../element/v7/apply-v7.4.3-data-hub-final-hotfix.py
          python ../element/v7/apply-v7.4.2-club-show-compat.py
          python ../element/v7/apply-v7.5-club-squads.py
          python ../element/v7/apply-v7.5.1-squads-compile-hotfix.py
          python ../element/v7/apply-v7.6-staff-power-tools.py
          python ../element/v7/apply-v7.7-club-power-tools.py
          python ../element/v7/apply-v7.7.1-club-power-compile-hotfix.py
          python ../element/v7/apply-v7.8-fmrte-premium-ui.py
          python ../element/v7/apply-v7.9-fmrte-player-surfaces.py
          python ../element/v7/apply-v7.9.1-relationships-borrow-hotfix.py
          python ../element/v7/apply-v8.0-fmrte-club-tactical.py

      - name: Stage generated source
        shell: bash
        run: |
          mkdir -p generated/src/ui generated/src/bridge generated/src/fields/fm27
          cp source/src/ui/player_panel.rs generated/src/ui/
          cp source/src/ui/club_panel.rs generated/src/ui/
          cp source/src/ui/staff_panel.rs generated/src/ui/
          cp source/src/ui/player_data_hub.rs generated/src/ui/
          cp source/src/app.rs generated/src/
          cp source/src/cache.rs generated/src/
          cp source/src/player.rs generated/src/
          cp source/src/bridge/cmd.rs generated/src/bridge/
          cp source/src/bridge/force_transfer.rs generated/src/bridge/
          cp source/src/bridge/tactical_max_plan.rs generated/src/bridge/
          cp source/src/fields/fm27/player.rs generated/src/fields/fm27/

      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          name: element-v8-generated-source
          path: generated/**
          if-no-files-found: error
